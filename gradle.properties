org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# WayMap release (git tag) resolved from JitPack. See settings.gradle.kts for local development.
wayMapVersion=v0.1.0

# Where the app downloads the published speed-camera dataset (meta.json + cameras.json).
# Public, keyless URL written by .github/workflows/update-cameras.yml — not a secret.
wayguard.dataBaseUrl=https://raw.githubusercontent.com/ShiKi5473/WayGuard/main/data/published/

# GitHub repository (owner/name) checked for app self-updates via Releases API.
wayguard.githubRepo=ShiKi5473/WayGuard
