name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本號（例如 0.2.0；會自動加上 v 前綴）'
        required: true
        type: string
      prerelease:
        description: '標記為 Pre-release（預先發行版，App 自動更新不會安裝）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 解析版本資訊
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          else
            RAW_TAG="v${GITHUB_EVENT_INPUTS_VERSION#v}"
          fi
          VERSION_NAME="${RAW_TAG#v}"
          CORE="${VERSION_NAME%%-*}"
          CORE="${CORE%%+*}"
          IFS='.' read -r MAJOR MINOR PATCH _ <<< "$CORE"
          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "::error::版本號格式不正確（需為 X.Y.Z）：$VERSION_NAME"
            exit 1
          fi
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          if [ "$VERSION_CODE" -lt 1 ]; then VERSION_CODE=1; fi
          echo "TAG_NAME=v${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
        env:
          GITHUB_EVENT_INPUTS_VERSION: ${{ inputs.version }}

      - name: 執行單元測試
        run: ./gradlew :guard-core:test :app:testDebugUnitTest

      - name: 準備 Release 簽章金鑰
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::請先在 Repository Secrets 設定 ANDROID_KEYSTORE_BASE64、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD，以確保每次發佈的 APK 簽章一致（Android 覆蓋更新必須使用相同簽章）。"
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -di > "$KEYSTORE_PATH"
          echo "SIGNING_STORE_FILE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}" >> "$GITHUB_ENV"

      - name: 建置並簽署 Release APK
        run: ./gradlew :app:assembleRelease -Pwayguard.versionName="${VERSION_NAME}" -Pwayguard.versionCode="${VERSION_CODE}"

      - name: 整理發佈檔案與 SHA-256
        run: |
          mkdir -p dist
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::找不到簽署後的 Release APK：$APK_SRC"
            exit 1
          fi
          APK_NAME="WayGuard-v${VERSION_NAME}.apk"
          cp "$APK_SRC" "dist/${APK_NAME}"
          (cd dist && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")

      - name: 發佈 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: WayGuard ${{ env.TAG_NAME }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease == true }}
          files: |
            dist/WayGuard-v${{ env.VERSION_NAME }}.apk
            dist/WayGuard-v${{ env.VERSION_NAME }}.apk.sha256
