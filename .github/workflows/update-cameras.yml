name: 更新測速照相點位

on:
  schedule:
    # 每週一 03:00（台灣時間 UTC+8）
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      verify_all:
        description: '強制全量交叉驗證所有點位座標'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: update-cameras
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # 下載警政署 CSV → 正規化/驗證 → 內容有變才改寫 data/published/。
      # 位置交叉驗證與本機道路走向比對依賴 OpenStreetMap 台灣圖資，設為 continue-on-error
      # 以免外部圖資暫時無法取得時阻擋每週點位發布；每月第一個週一（或手動勾選 verify_all）
      # 會執行全量驗證，其餘每週僅增量檢查新增或變動的點位。
      - name: 抓取 OSM 圖資並執行位置交叉驗證
        id: verify
        continue-on-error: true
        env:
          TGOS_APP_ID: ${{ secrets.TGOS_APP_ID }}
          TGOS_API_KEY: ${{ secrets.TGOS_API_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y osmium-tool
          curl -fsSL --retry 3 -o /tmp/taiwan-latest.osm.pbf https://download.geofabrik.de/asia/taiwan-latest.osm.pbf
          osmium tags-filter -O -o /tmp/taiwan-filtered.osm.pbf /tmp/taiwan-latest.osm.pbf w/highway r/route=road r/boundary=administrative n/highway=milestone
          osmium export -O -f geojsonseq -o /tmp/taiwan-extract.geojsonseq /tmp/taiwan-filtered.osm.pbf
          EXTRA=""
          if [ "$(date +%d)" -le 7 ] || [ "${{ inputs.verify_all }}" = "true" ]; then
            EXTRA="--verify-all"
          fi
          ./gradlew :camera-sync:run --args="--osm-extract /tmp/taiwan-extract.geojsonseq $EXTRA"

      # 若 OSM 圖資步驟失敗，改以既有快取與資料內部檢查完成每週發布。
      - name: 抓取並驗證資料（無 OSM 圖資備援）
        if: steps.verify.outcome != 'success'
        run: |
          echo "> ⚠️ 本次 OSM 圖資驗證步驟未完成，已改用既有快取與資料內部檢查完成發布。" >> "$GITHUB_STEP_SUMMARY"
          ./gradlew :camera-sync:run

      - name: 報告
        if: always()
        run: |
          if [ -f build/camera-report.md ]; then cat build/camera-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: 保存報告與建議清單
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-sync-report
          path: |
            build/camera-report.md
            build/section-candidates.csv
            build/location-fix-suggestions.json
            build/tgos-upload.csv
          if-no-files-found: ignore

      - name: Commit 新資料
        run: |
          if [ -z "$(git status --porcelain -- data/published data/generated)" ]; then
            echo "資料未變更，不需 commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published data/generated
          git commit -m "更新測速照相點位資料（$(jq -r .version data/published/meta.json)，$(jq -r .count data/published/meta.json) 筆）"
          git push
