name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 可在 Actions 頁面手動重跑（例如 GitHub 事故導致 push 事件遺失時）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew :guard-core:test :camera-sync:build :app:testDebugUnitTest :app:assembleDebug
